# -----------------------------------------------------------------------
#  nginx: обратный прокси для анимеДик
#
#  Куда класть:
#    этот файл         -> /etc/nginx/sites-available/anime
#    nginx-limits.conf -> /etc/nginx/conf.d/anime-limits.conf
#
#  ГЛАВНОЕ ИЗМЕНЕНИЕ ПО СРАВНЕНИЮ С ПРЕДЫДУЩЕЙ ВЕРСИЕЙ
#  ---------------------------------------------------
#  Файл /etc/nginx/proxy_params, который подключается ниже, содержит строку
#      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#  Она не ЗАМЕНЯЕТ заголовок, а ДОПИСЫВАЕТ настоящий адрес в конец того,
#  что прислал посетитель. То есть если посетитель отправил
#      X-Forwarded-For: 1.2.3.4
#  до приложения доходило «1.2.3.4, настоящий-адрес» — и первое значение
#  в этой строке придумал он сам.
#
#  Приложение раньше брало именно первое значение. Результат: подставляя
#  каждый раз новый адрес, посторонний выглядел как новый человек и обходил
#  и ограничение попыток входа, и лимит гостевых пропусков.
#
#  Теперь заголовок перезаписывается здесь начисто, а приложение вдобавок
#  берёт последнее значение цепочки и проверяет, что это вообще адрес.
#  Дыра закрыта с обеих сторон.
#
#  X-Real-IP ниже выставляется явно в каждом location, хотя его ставит и
#  proxy_params. Это не лишнее: proxy_params — файл дистрибутива, его
#  содержимое меняется от системы к системе и может однажды приехать
#  другим с обновлением. Приложение спрашивает этот заголовок первым,
#  поэтому он должен приходить от нас, а не «скорее всего, приходить».
# -----------------------------------------------------------------------

server {
    # Наружу порт не смотрит: сюда приходит только Cloudflare Tunnel,
    # который подключается к localhost. Если понадобится открыть сайт
    # в локальной сети, замените строку на «listen 80 default_server;»
    # и обязательно прочитайте примечание про CF-Connecting-IP ниже.
    listen 127.0.0.1:80 default_server;
    server_name _;

    # Когда появится второй сайт — замените две строки выше на:
    #   listen 127.0.0.1:80;
    #   server_name anime.вашдомен.ру;

    client_max_body_size  6M;      # хватает на аватар с запасом
    client_body_timeout   15s;
    client_header_timeout 15s;
    server_tokens off;

    # ------------------------------------------------------------------
    # Настоящий адрес посетителя
    # ------------------------------------------------------------------
    # Туннель подключается с localhost, поэтому без этих строк все гости
    # выглядели бы как один посетитель 127.0.0.1 — и ограничения частоты
    # ниже били бы по всем сразу: один перебор, и сайт закрыт для всех.
    #
    # Доверять CF-Connecting-IP можно ровно потому, что мы слушаем только
    # localhost: подставить этот заголовок может лишь тот, кто уже внутри
    # виртуалки. Если вы поменяли listen на «listen 80;» — эти строки
    # НАДО ЗАКОММЕНТИРОВАТЬ, иначе заголовок подделает кто угодно.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header   CF-Connecting-IP;
    real_ip_recursive off;

    # Приложение само выставляет политику содержимого и остальные
    # защитные заголовки. Здесь только то, что относится к прокси.
    add_header X-Content-Type-Options "nosniff" always;

    limit_conn anime_conn 20;

    # По умолчанию при упоре в лимит nginx отвечает 503 «сервис недоступен».
    # Это неправда и сбивает с толку: сервис доступен, просто конкретный
    # посетитель частит. 429 — ровно про это, и приложение показывает по
    # нему понятный текст вместо «Ошибка 503».
    limit_req_status  429;
    limit_conn_status 429;

    # Вход ограничиваем жёстче всего: это главная мишень для перебора.
    # Второй рубеж — счётчик попыток внутри приложения.
    location /api/auth/login {
        limit_req zone=anime_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        # ПОСЛЕ include: перекрываем то, что подставил proxy_params
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    location /api/ {
        limit_req zone=anime_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Скрытые файлы не отдаём никогда
    location ~ /\. {
        deny all;
        return 404;
    }
}
