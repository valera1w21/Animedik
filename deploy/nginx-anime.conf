# -----------------------------------------------------------------------
#  nginx: the reverse proxy for animeDik
#
#  Where to put it:
#    this file         -> /etc/nginx/sites-available/anime
#    nginx-limits.conf -> /etc/nginx/conf.d/anime-limits.conf
#
#  THE MAIN CHANGE COMPARED WITH THE PREVIOUS VERSION
#  --------------------------------------------------
#  The file /etc/nginx/proxy_params, included below, contains the line
#      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#  It does not REPLACE the header, it APPENDS the real address to the end of
#  what the visitor sent. That is, if the visitor sent
#      X-Forwarded-For: 1.2.3.4
#  what reached the application was "1.2.3.4, the-real-address" — and the
#  first value in that line was made up by them.
#
#  The application used to take exactly the first value. The result: by
#  substituting a new address every time, an outsider looked like a new
#  person and bypassed both the sign-in attempt limit and the guest pass
#  limit.
#
#  Now the header is overwritten here from scratch, and the application in
#  addition takes the last value of the chain and checks that it is an
#  address at all. The hole is closed from both sides.
#
#  X-Real-IP below is set explicitly in every location, although proxy_params
#  sets it too. That is not redundant: proxy_params is a distribution file,
#  its contents differ from system to system and may one day arrive different
#  with an update. The application asks for this header first, so it must
#  come from us rather than "most likely come".
# -----------------------------------------------------------------------

server {
    # The port does not face outwards: only the Cloudflare Tunnel arrives
    # here, and it connects to localhost. If you need to open the site on
    # your local network, replace the line with "listen 80 default_server;"
    # and be sure to read the note about CF-Connecting-IP below.
    listen 127.0.0.1:80 default_server;
    server_name _;

    # When a second site appears — replace the two lines above with:
    #   listen 127.0.0.1:80;
    #   server_name anime.your-domain.com;

    client_max_body_size  6M;      # хватает на аватар с запасом
    client_body_timeout   15s;
    client_header_timeout 15s;
    server_tokens off;

    # ------------------------------------------------------------------
    # The visitor's real address
    # ------------------------------------------------------------------
    # The tunnel connects from localhost, so without these lines every guest
    # would look like one visitor, 127.0.0.1 — and the rate limits below
    # would hit everyone at once: one bout of guessing and the site is closed
    # for all.
    #
    # CF-Connecting-IP can be trusted precisely because we listen on
    # localhost only: this header can be planted only by someone already
    # inside the virtual machine. If you changed listen to "listen 80;" —
    # these lines MUST BE COMMENTED OUT, otherwise anyone can forge the
    # header.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header   CF-Connecting-IP;
    real_ip_recursive off;

    # The application sets the content policy and the other protective
    # headers itself. Here there is only what concerns the proxy.
    add_header X-Content-Type-Options "nosniff" always;

    limit_conn anime_conn 20;

    # By default, on hitting a limit nginx answers 503 "service unavailable".
    # That is untrue and misleading: the service is available, it is just
    # that one particular visitor is going too fast. 429 is exactly about
    # that, and the application shows a clear text for it instead of
    # "Error 503".
    limit_req_status  429;
    limit_conn_status 429;

    # We limit sign-in the hardest: it is the main target for guessing.
    # The second line of defence is the attempt counter inside the
    # application.
    location /api/auth/login {
        limit_req zone=anime_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        # AFTER include: we override what proxy_params put in
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    location /api/ {
        limit_req zone=anime_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Hidden files are never served
    location ~ /\. {
        deny all;
        return 404;
    }
}
