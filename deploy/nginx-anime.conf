# -----------------------------------------------------------------------
#  nginx: обратный прокси для анимеДик
#
#  Куда класть:
#    этот файл         -> /etc/nginx/sites-available/anime
#    nginx-limits.conf -> /etc/nginx/conf.d/anime-limits.conf
#  После правки любого из двух: sudo nginx -t && sudo systemctl reload nginx
#
#  ПОЧЕМУ ЗАГОЛОВКИ К ПРИЛОЖЕНИЮ ЗАДАНЫ ЗДЕСЬ ЦЕЛИКОМ
#  --------------------------------------------------
#  Раньше подключался файл дистрибутива /etc/nginx/proxy_params. В нём строка
#      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#  Она не ЗАМЕНЯЕТ заголовок, а ДОПИСЫВАЕТ настоящий адрес в конец того,
#  что прислал посетитель: на «X-Forwarded-For: 1.2.3.4» до приложения
#  доходило «1.2.3.4, настоящий-адрес», и первое значение придумал он сам.
#  Подставляя каждый раз новое, посторонний выглядел новым человеком и
#  обходил и ограничение попыток входа, и лимит гостевых пропусков.
#
#  Теперь proxy_params не подключается вообще: все заголовки, которые
#  уходят приложению, перечислены ниже на уровне server и действуют во
#  всех location. Файл дистрибутива может однажды приехать с обновлением
#  другим — на этот сайт это не повлияет.
#
#  ВАЖНО: в location ниже не пишите proxy_set_header. nginx устроен так,
#  что одна такая строка внутри location отменяет ВСЕ proxy_set_header
#  уровня server для этого location — и адрес посетителя снова станет
#  подделываемым. То же с add_header и proxy_hide_header.
# -----------------------------------------------------------------------

server {
    # Наружу порт не смотрит: сюда приходит только Cloudflare Tunnel,
    # который подключается к localhost. Если понадобится открыть сайт
    # в локальной сети, замените строку на «listen 80 default_server;»
    # и обязательно прочитайте примечание про CF-Connecting-IP ниже.
    listen 127.0.0.1:80 default_server;
    server_name _;

    # Когда появится второй сайт — замените две строки выше на:
    #   listen 127.0.0.1:80;
    #   server_name anime.вашдомен.ру;

    # Самое большое, что сайт принимает, — баннер профиля (до 700 КБ,
    # проверяет само приложение). 1 МБ — с запасом. Больше nginx даже
    # не станет читать: ответит 413 сразу.
    client_max_body_size  1m;
    client_body_timeout   15s;
    client_header_timeout 15s;
    # Заголовки запроса: до 4 буферов по 16 КБ. Самый длинный адрес сайта —
    # прокладка видео /api/hls (подписанная ссылка до ~5 КБ) — влезает с
    # запасом; всё длиннее nginx отвергает сам (414/400), не тревожа приложение.
    large_client_header_buffers 4 16k;
    server_tokens off;

    # ------------------------------------------------------------------
    # Настоящий адрес посетителя
    # ------------------------------------------------------------------
    # Туннель подключается с localhost, поэтому без этих строк все гости
    # выглядели бы как один посетитель 127.0.0.1 — и ограничения частоты
    # ниже били бы по всем сразу: один перебор, и сайт закрыт для всех.
    #
    # Доверять CF-Connecting-IP можно ровно потому, что мы слушаем только
    # localhost: подставить этот заголовок может лишь тот, кто уже внутри
    # виртуалки. Если вы поменяли listen на «listen 80;» — эти строки
    # НАДО ЗАКОММЕНТИРОВАТЬ, иначе заголовок подделает кто угодно.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header   CF-Connecting-IP;
    real_ip_recursive off;

    # Сайт пользуется только этими способами запроса. Всё остальное
    # (PUT, PATCH, OPTIONS, TRACE, выдуманные слова) до приложения
    # не доходит: меньше путей — меньше мест для ошибки.
    if ($request_method !~ ^(GET|HEAD|POST|DELETE)$) {
        return 405;
    }

    # Имя сайта со знаками «?», «#» и подобными — не имя сайта, а попытка
    # запутать приложение (см. nginx-limits.conf, $animedik_host_ok).
    if ($animedik_host_ok = 0) {
        return 400;
    }

    # ------------------------------------------------------------------
    # Что уходит приложению (действует во всех location ниже)
    # ------------------------------------------------------------------
    # $host — имя сайта, уже проверенное nginx. Сырой заголовок Host
    # ($http_host) мог бы нести «/», «?» или «#», а старые версии Starlette
    # из-за такого Host видели не тот путь, что был запрошен на самом деле
    # (CVE-2026-48710): проверка «это админка?» промахивалась.
    # НЕ УБИРАТЬ: по Host приложение ещё и сверяет Origin у запросов,
    # меняющих данные (POST/DELETE). Без этой строки все кнопки сайта
    # отвечали бы 403 «Запрос отклонён».
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Эти приложению не нужны, а придумать их может кто угодно — убираем
    # (пустое значение = заголовок не передаётся).
    proxy_set_header Forwarded         "";
    proxy_set_header X-Forwarded-Host  "";
    # Только один простой диапазон, см. nginx-limits.conf
    proxy_set_header Range             $animedik_range;

    proxy_connect_timeout 10s;

    # Приложение само выставляет политику содержимого (CSP) и остальные
    # защитные заголовки. Здесь — только nosniff, и ровно один раз: свой
    # заголовок приложения прячем и ставим тот же сами. Так он есть и на
    # ответах, которые nginx отдаёт сам (429, 413, 502), и не дублируется
    # на обычных ответах.
    proxy_hide_header X-Content-Type-Options;
    add_header X-Content-Type-Options "nosniff" always;

    limit_conn anime_conn 20;

    # По умолчанию при упоре в лимит nginx отвечает 503 «сервис недоступен».
    # Это неправда и сбивает с толку: сервис доступен, просто конкретный
    # посетитель частит. 429 — ровно про это.
    limit_req_status  429;
    limit_conn_status 429;

    # Ошибки, которые nginx отдаёт САМ (приложение до них не дошло):
    # короткий ответ с понятным текстом вместо стандартной страницы nginx.
    # Ответы самого приложения (его 404, 429 и т. д.) не подменяются.
    # Эти строки — для страниц; у location /api/… ниже свои, с JSON.
    # (error_page внутри location отменяет error_page уровня server —
    # поэтому там все три строки повторены целиком.)
    error_page 413             /__animedik_err/api-413;
    error_page 429             /__animedik_err/page-429;
    error_page 500 502 503 504 /__animedik_err/page-50x;

    # ------------------------------------------------------------------
    # Вход, гостевой пропуск, выход — жёстче всего: главная мишень для
    # перебора паролей. Второй рубеж — счётчик попыток внутри приложения.
    location /api/auth/ {
        limit_req zone=anime_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 30s;
        error_page 413             /__animedik_err/api-413;
        error_page 429             /__animedik_err/api-429;
        error_page 500 502 503 504 /__animedik_err/api-50x;
    }

    # Куски видео через прокладку (api/hls.py). Отдаются потоком, без
    # промежуточной записи на диск (proxy_buffering off): видео идёт к
    # зрителю сразу, а не после того, как nginx сохранит кусок целиком.
    location /api/hls {
        limit_req zone=anime_hls burst=200 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        error_page 413             /__animedik_err/api-413;
        error_page 429             /__animedik_err/api-429;
        error_page 500 502 503 504 /__animedik_err/api-50x;
    }

    # Остальные запросы страницы. Буферизация включена (так по умолчанию):
    # nginx быстро забирает ответ у приложения и сам отдаёт его медленному
    # телефону, а у приложения в это время освобождаются руки.
    location /api/ {
        limit_req zone=anime_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        error_page 413             /__animedik_err/api-413;
        error_page 429             /__animedik_err/api-429;
        error_page 500 502 503 504 /__animedik_err/api-50x;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 60s;
    }

    # Скрытые файлы (.env, .git и прочие) не отдаём никогда
    location ~ /\. {
        return 404;
    }

    # ------------------------------------------------------------------
    # Тексты ошибок nginx. internal — снаружи по этим адресам не зайти.
    # Для /api/ — JSON с полем detail: страница сайта показывает его
    # человеку как есть. Для обычных страниц — короткий HTML.
    # ------------------------------------------------------------------
    location ^~ /__animedik_err/ {
        internal;
        # add_header здесь свой, поэтому nosniff повторён (см. ВАЖНО вверху)
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;

        location = /__animedik_err/api-413 {
            default_type "application/json; charset=utf-8";
            return 413 '{"detail":"Файл слишком большой"}';
        }
        location = /__animedik_err/api-429 {
            default_type "application/json; charset=utf-8";
            return 429 '{"detail":"Слишком часто. Подождите минуту и попробуйте снова."}';
        }
        location = /__animedik_err/api-50x {
            default_type "application/json; charset=utf-8";
            return 502 '{"detail":"Сервер сейчас не отвечает. Попробуйте через минуту."}';
        }
        location = /__animedik_err/page-429 {
            default_type "text/html; charset=utf-8";
            return 429 '<!doctype html><meta charset="utf-8"><title>Слишком часто</title><p>Слишком много запросов подряд. Подождите минуту и обновите страницу.</p>';
        }
        location = /__animedik_err/page-50x {
            default_type "text/html; charset=utf-8";
            return 502 '<!doctype html><meta charset="utf-8"><title>Сайт перезапускается</title><p>Сайт сейчас перезапускается. Обновите страницу через минуту.</p>';
        }
        return 404;
    }
}
