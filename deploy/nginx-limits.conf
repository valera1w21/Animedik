# Копируется в /etc/nginx/conf.d/anime-limits.conf
# Эти директивы обязаны лежать в общей секции http, поэтому вынесены отдельно.
# После правки: sudo nginx -t && sudo systemctl reload nginx

# --- Ограничения частоты (по настоящему адресу посетителя) -----------------
#
# api   — обычные запросы страницы: 2 в секунду в среднем, рывком до 40.
# login — вход, гостевой пропуск, выход: 10 в минуту, рывком до 5.
#         Главная мишень для перебора паролей; второй рубеж — счётчик
#         попыток внутри приложения.
# hls   — куски видео через прокладку /api/hls. Плеер берёт их пачками
#         (особенно при перемотке), поэтому лимит свой и щедрый: иначе
#         два человека за одним роутером упирались бы в общий лимит api,
#         и видео вставало бы с ошибкой 429.
limit_req_zone  $binary_remote_addr zone=anime_api:10m   rate=120r/m;
limit_req_zone  $binary_remote_addr zone=anime_login:10m rate=10r/m;
limit_req_zone  $binary_remote_addr zone=anime_hls:10m   rate=600r/m;
limit_conn_zone $binary_remote_addr zone=anime_conn:10m;

# --- Заголовок Range: до приложения доходит только один простой диапазон ----
#
# Range просит «не весь файл, а кусок с такого-то байта». Сайту он нужен
# максимум в простом виде «bytes=0-1023». А в старых версиях Starlette
# (библиотека под FastAPI) разбор заголовка из сотен диапазонов вида
# «bytes=0-0,2-2,4-4,…» занимал секунды процессора на один запрос —
# CVE-2025-62727. У сайта один рабочий процесс, и пока он считает
# такой запрос, все остальные ждут.
#
# Библиотека обновлена, но страховка дешёвая: всё, что сложнее одного
# диапазона, nginx просто не передаёт (пустое значение = заголовка нет),
# и приложение отдаёт файл целиком, как на обычный запрос.
map $http_range $animedik_range {
    default                        "";
    "~^bytes=[0-9]{1,15}-[0-9]{0,15}$"  $http_range;
    "~^bytes=-[0-9]{1,15}$"             $http_range;
}

# --- Имя сайта в запросе (заголовок Host) ----------------------------------
#
# nginx сам отбрасывает Host с «/» или пробелом, но пропускает «?» и «#».
# А старые версии Starlette собирали из Host адрес запроса и из-за
# «example.com?x=» видели не тот путь, что был запрошен на самом деле
# (CVE-2026-48710): проверка «это админка?» в приложении промахивалась.
# Настоящему имени сайта (домен, адрес вида 127.0.0.1) эти знаки не нужны.
# 0 — имя подозрительное, такой запрос получит 400 (см. nginx-anime.conf).
map $host $animedik_host_ok {
    default              0;
    "~*^[a-z0-9._-]+$"   1;
}
