# Имя проекта задано жёстко. Без этой строки docker берёт его из имени
# папки: проект в ~/animedik и тот же проект в /opt/animedik или
# ~/anime-tracker считались бы РАЗНЫМИ. Для второй папки docker завёл бы
# новый пустой том (база «пропала», хотя лежит в старом) или упёрся бы
# в «container name is already in use». С постоянным именем откуда бы
# ни запускать — это один и тот же проект, тот же контейнер и тот же
# том animedik_anime-data.
name: animedik

services:
  app:
    build: .
    container_name: animedik
    # Наружу порт не открыт: достучаться можно только через nginx на этой
    # же машине. (Держите docker обновлённым: до версии 28 порт «только
    # 127.0.0.1» при особой настройке сети был виден соседям по локалке.)
    ports:
      - "127.0.0.1:8080:8000"
    restart: unless-stopped
    # Маленький «init» первым процессом: передаёт сигнал остановки и
    # убирает завершившиеся процессы-сироты.
    init: true
    # Сколько ждать аккуратной остановки (uvicorn сам укладывается в 10 с).
    stop_grace_period: 20s

    # --- Защита контейнера -------------------------------------------------
    # Файловая система только для чтения: даже найдя дыру в сайте, нельзя
    # подменить его код или подложить свою программу. Писать можно только
    # в том с базой (/data) и во временную /tmp в памяти.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    # Никаких особых прав ядра: сайту они не нужны вообще (порт 8000 > 1024).
    cap_drop:
      - ALL
    # Запрет повышать права изнутри (setuid-программы и т. п.).
    security_opt:
      - no-new-privileges:true
    # Потолки на случай ошибки или атаки: зависший или раздувшийся сайт не
    # утянет за собой всю виртуалку (nginx, SSH останутся живы).
    # Обычно сайту хватает 200–300 МБ; при упоре в mem_limit docker
    # перезапустит контейнер.
    mem_limit: 1g
    pids_limit: 256

    # Журнал контейнера с ротацией: без неё файл журнала растёт вечно
    # (каждый запрос — строка) и однажды забивает диск.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # Все настройки берутся из файла .env рядом с этим файлом. Переменные
    # перечислены поимённо, а не «весь .env целиком» (env_file), чтобы
    # было видно, что именно уходит в контейнер, и случайная строка из
    # .env туда не попадала. Новая переменная в .env.example — новая
    # строка здесь (это сверяет check34_ops.py).
    environment:
      # Режим работы.
      #
      #   demo    — публичная витрина: плеер играет фильмы Blender
      #             Foundation под Creative Commons.
      #   private — видео с внешних источников, которые вы подключили сами
      #             (api/anime.py, SOURCES); без них ручки видео отвечают
      #             501. Библиотеки для них — в requirements-private.txt
      #             (ставятся при сборке образа, см. Dockerfile).
      #
      # По умолчанию demo: это публичная версия, и забытая переменная
      # должна поднимать безопасную витрину.
      MODE: "${MODE:-demo}"
      # Перед первым запуском задайте свою строку — она подмешивается
      # к отпечаткам сессий. Сменили строку → все сессии закрылись.
      SESSION_PEPPER: "${SESSION_PEPPER:?задайте SESSION_PEPPER в файле .env}"
      # 1 — сайт работает по https (так и должно быть через туннель).
      # 0 ставят только на время проверки по обычному http, иначе
      # браузер не сохранит куку входа. Задаётся в .env.
      COOKIE_SECURE: "${COOKIE_SECURE:-1}"
      # 1 — доверять адресу посетителя от нашего nginx (X-Real-IP)
      TRUST_PROXY: "1"
      # Подробность журнала: INFO обычно, DEBUG — при разборе неполадок.
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      # Письма о новых сериях. Пусто — письма не отправляются, сайт
      # работает как обычно. Значения — в .env (образец в .env.example).
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      # Отправитель. Не задан — берётся SMTP_USER, как и в самом
      # приложении. Пустую строку сюда передавать нельзя: для приложения
      # «задано, но пусто» значит «отправителя нет», и письма бы молчали.
      SMTP_FROM: "${SMTP_FROM:-${SMTP_USER:-}}"
      # Адрес сайта для ссылок в письмах, например https://anime.example.ru
      SITE_URL: "${SITE_URL:-}"
      # Помощник в пузыре «?». Ключ пустой — помощник выключен, сайт
      # работает как обычно. Как получить ключ — в .env.example.
      HELPER_API_KEY: "${HELPER_API_KEY:-}"
      HELPER_BASE_URL: "${HELPER_BASE_URL:-https://api.groq.com/openai/v1}"
      HELPER_MODEL: "${HELPER_MODEL:-llama-3.3-70b-versatile}"
      # Порядок английских источников (если подключили свои, см.
      # api/anime.py). Пусто — как в коде.
      EN_SOURCES: "${EN_SOURCES:-}"
      # Как часто (в минутах) проверять новые серии; 0 — не проверять.
      UPDATES_EVERY_MIN: "${UPDATES_EVERY_MIN:-15}"
      # SHOW_DOCS сюда не передаётся намеренно: он открывает схему API
      # (/docs), а на рабочем сервере она должна быть закрыта.
    volumes:
      - anime-data:/data
    # Проверка «жив ли сайт» (healthcheck) описана в Dockerfile.

volumes:
  anime-data:
