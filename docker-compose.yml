services:
  app:
    build: .
    container_name: animedik
    # Наружу порт не открыт: достучаться можно только через nginx
    ports:
      - "127.0.0.1:8080:8000"
    restart: unless-stopped
    environment:
      # Режим работы.
      #
      #   demo    — публичная витрина: плеер играет фильмы Blender
      #             Foundation под Creative Commons. Внешних источников
      #             видео нет, ставить ничего не нужно.
      #   private — личная версия: видео берётся с внешних источников.
      #             Требует зависимостей из requirements-private.txt.
      #
      # По умолчанию demo: если переменную забыли, поднимется безопасный
      # вариант, а не наоборот.
      MODE: "${MODE:-demo}"
      # Перед первым запуском задайте свою строку — она подмешивается
      # к отпечаткам сессий. Сменили строку → все сессии закрылись.
      SESSION_PEPPER: "${SESSION_PEPPER:?задайте SESSION_PEPPER в файле .env}"
      # 1 — сайт работает по https (так и должно быть через туннель)
      COOKIE_SECURE: "1"
      # 1 — доверять заголовку X-Forwarded-For от нашего nginx
      TRUST_PROXY: "1"
    volumes:
      - anime-data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  anime-data:
