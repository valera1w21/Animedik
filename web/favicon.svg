<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Значок сайта — тот же знак, что в шапке (квадрат мята → голубой →
       лаванда и треугольник «играть»), но в стиле кнопок сайта: обводка
       тушью и жёсткая сдвинутая тень, как оттиск в манге. Обводка ещё и
       нужна по делу: на светлой полосе вкладок пастельный квадрат без
       неё почти не виден. Те же размеры нарисованы в PNG и ICO рядом. -->
  <defs>
    <linearGradient id="g" x1="1" y1="1" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#84CBB6"/>
      <stop offset=".55" stop-color="#8DB5DF"/>
      <stop offset="1" stop-color="#AEA1D8"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="27" height="27" rx="7" fill="#171A21"/>
  <rect x="1.75" y="1.75" width="25.5" height="25.5" rx="6.25" fill="url(#g)" stroke="#171A21" stroke-width="1.5"/>
  <path d="M11.74 9.9v9.2l8.37-4.6z" fill="#171A21" stroke="#171A21" stroke-width="1.94" stroke-linejoin="round"/>
</svg>
